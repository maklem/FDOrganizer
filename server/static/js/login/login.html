<div class="login" style="overflow: scroll;">
    <TopBanner></TopBanner>
    <h2>{{ $t('login.title') }}</h2>
    <div class="content">
        <div v-html="store.consent"></div>
        <form v-if="store.selectedOrganisation !== undefined && !store.loading.organisations">
            <LabeledInput
                id="organisation-selector"
                :label="'Choose your organisation'"
                :type="'monoselect'"
                :options="organisations"
                :value="store.selectedOrganisation.id"
                @input="(value) => store.selectOrganisation(value)"
                v-if="organisations.length > 1"
            ></LabeledInput>
            <fieldset v-if="store.selectedOrganisation.authType === 'LOCAL'">
                <LabeledInput
                    id="auth-username"
                    :label="'Username'"
                    :placeholder="'Your username for ' + store.selectedOrganisation.name"
                    :value="store.username"
                    :invalid="store.failedLogin"
                    @input="(value) => store.username = value"
                    :required="true"
                ></LabeledInput>
                <LabeledInput
                    id="auth-password"
                    :label="'Password'"
                    :placeholder="'The password for ' + store.selectedOrganisation.name"
                    :type="'password'"
                    :value="store.password"
                    :invalid="store.failedLogin"
                    @input="(value) => store.password = value"
                    :required="true"
                ></LabeledInput>
                <div class="error-text" :class="{visible: store.failedLogin}">
                    Wrong username or password!
                </div>
                <Button @button-clicked="store.loginLocal()">Zustimmen und Einloggen</Button>
            </fieldset>
            <Button v-if="store.selectedOrganisation.authType === 'OIDC'" @button-clicked="store.loginOIDC()">Zustimmen und Einloggen</Button>
            <Button v-if="store.selectedOrganisation.authType === 'KEYCLOAK'" @button-clicked="store.loginKeycloak()">Zustimmen und Einloggen</Button>
        </form>
        <div v-else class="lds-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
</div>
<Footer></footer>
