<div class="login" style="overflow: scroll;">
    <TopBanner></TopBanner>
    <h2>{{ $t('login.title') }}<LocaleSwitch></LocaleSwitch></h2>
    <div class="content">
        <div v-html="store.consent"></div>
        <form v-if="store.selectedOrganisation !== undefined && !store.loading.organisations">
            <LabeledInput
                id="organisation-selector"
                :label="$t('login.organisation.label')"
                :type="'monoselect'"
                :options="organisations"
                :value="store.selectedOrganisation.id"
                @input="(value) => store.selectOrganisation(value)"
                v-if="organisations.length > 1"
            ></LabeledInput>
            <fieldset v-if="store.selectedOrganisation.authType === 'LOCAL'">
                <LabeledInput
                    id="auth-username"
                    :label="$t('login.username.label')"
                    :placeholder="$t('login.username.placeholder', { name: store.selectedOrganisation.name })"
                    :value="store.username"
                    :invalid="store.failedLogin"
                    @input="(value) => store.username = value"
                    :required="true"
                ></LabeledInput>
                <LabeledInput
                    id="auth-password"
                    :label="$t('login.password.label')"
                    :placeholder="$t('login.password.placeholder', { name: store.selectedOrganisation.name })"
                    :type="'password'"
                    :value="store.password"
                    :invalid="store.failedLogin"
                    @input="(value) => store.password = value"
                    :required="true"
                ></LabeledInput>
                <div class="error-text" :class="{visible: store.failedLogin}">
                    {{ $t('login.error.credentials') }}
                </div>
                <Button @button-clicked="store.loginLocal()">{{ $t('login.submit') }}</Button>
            </fieldset>
            <Button v-if="store.selectedOrganisation.authType === 'OIDC'" @button-clicked="store.loginOIDC()">{{ $t('login.submit') }}</Button>
            <Button v-if="store.selectedOrganisation.authType === 'KEYCLOAK'" @button-clicked="store.loginKeycloak()">{{ $t('login.submit') }}</Button>
        </form>
        <div v-else class="lds-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
</div>
<Footer></footer>
