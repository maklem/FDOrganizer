<div
    class="package-list-item"
    :class="{active: store.selectedPackage?.id === id}"
    @click="!active && store.selectPackage(id)"
>
    <i class="fa-solid fa-box icon"></i>
    <div class="primary">
        <template v-if="!editMode">
            <span>{{name}}</span>
            <Button :flat class="edit-name" @button-clicked="editMode = true">
                <i class="fa-solid fa-pencil"></i>
            </Button>
        </template>
        <template v-else>
            <LabeledInput
                :id="'rename-' + id"
                :type="text"
                :value="newName"
                @click="$event.stopPropagation()"
                @input="newName = $event"
                @keyup.enter="store.changePackageName(id, newName)"
                @keyup.esc="editMode = false"
            />
            <Button
                :flat
                class="edit-abort"
                @button-clicked="editMode = false">
                <i class="fa-solid fa-xmark"></i>
            </Button>
            <Button
                :flat
                class="edit-confirm"
                @button-clicked="store.changePackageName(id, newName)">
                <i class="fa-solid fa-check"></i>
            </Button>
        </template>
    </div>
    <div class="secondary">{{ $t('status.archive.' + status) }} - {{ $t('packageListItem.expires') }} {{formatRelativeDate(keep_until)}}</div>
    <div class="action">
        <Button
        :flat
        class="open-metadata"
        @button-clicked="$emit('open-metadata')">
            <i class="fa-solid fa-book-medical"></i>
        </Button>
        <Button class="delete" :flat @button-clicked="openDialog">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
</div>
<dialog ref="confirmDelete" class="delete-package">
    <h1>{{ $t('packageListItem.deleteTitle', { name }) }}</h1>

    <div class="text">{{ $t('packageListItem.deleteText1') }}</div>
    <div class="text">{{ $t('packageListItem.deleteText2') }}</div>
    <div class="text">{{ $t('packageListItem.deleteQuestion') }}</div>
    <form method="dialog">
        <Button class="abort-delete" @button-clicked="closeDialog">{{ $t('packageListItem.cancel') }}</Button>
        <Button class="confirm-delete" @button-clicked="deletePackage(id)">
            <i class="fa-solid fa-trash"></i>
            <div>{{ $t('packageListItem.confirm') }}</div>
        </Button>
    </form>
</dialog>
