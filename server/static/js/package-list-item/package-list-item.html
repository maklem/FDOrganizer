<div
    class="package-list-item"
    :class="{active: store.selectedPackage?.id === id}"
    @click="store.selectPackage(id)"
>
    <i class="fa-solid fa-box icon"></i>
    <div class="primary">{{name}}</div>
    <div class="secondary">{{status}}</div>
    <div class="action">
        <Button class="delete" :flat @button-clicked="openDialog">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
</div>
<dialog ref="confirmDelete" class="delete-package">
    <h1>Delete {{name}}?</h1>

    <div class="text">The files you have uploaded manually will be deleted.</div>
    <div class="text">References to external files will be lost.</div>
    <div class="text">Do you really want to delete the project?</div>
    <form method="dialog">
        <Button class="abort-delete" @button-clicked="closeDialog">Do not delete</Button>
        <Button class="confirm-delete" @button-clicked="deletePackage(id)">
            <i class="fa-solid fa-trash"></i>
            <div>Delete project</div>
        </Button>
    </form>
</dialog>
