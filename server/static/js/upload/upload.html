<div class="manual-upload">
    <input @change="selectFiles" id="file-upload" type="file" multiple />
    <label for="file-upload" class="custom-file-upload" @dragover="addFileProxy" @dragleave="removeFileProxy"
        @drop="dropFiles">

        <UploadFile v-for="file in store.displayFiles()" v-bind="file"></UploadFile>

        <UploadFile v-if="fileProxy" v-bind="fileProxy"></UploadFile>
        <div v-if="store.draggedFiles.length" class="add-by-drag">
            <div>+{{store.draggedFiles.length}} {{store.draggedFiles.length > 1 ? 'files': 'file'}}</div>
        </div>
        <div class="add-files">
            <i class="fa-solid fa-plus"></i>
        </div>
    </label>
    <div class="button-row">
        <Button
        class="start-upload"
        @button-clicked="$refs.uploadFiles.showModal()"
        :disabled="store.files.length < 1"
        >Start Upload</Button>
    </div>
    <dialog
    ref="uploadFiles"
    class="upload-dialog" 
    @close="store.failedUploads = []">
        <div>
            <div v-if="store.loading.upload" class="loading"></div>
            <p>{{store.dialogText ?? `Do you really want to upload ${store.files.length} selected files?`}}</p>
            <form method="dialog">
                <Button class="close-button" @button-clicked="$refs.uploadFiles.close()">Abort</Button>
                <Button @button-clicked="store.startUpload()">{{store.failedUploads.length ? 'Try Again': 'Yes'}}</Button>
            </form>
        </div>
    </dialog>
</div>
