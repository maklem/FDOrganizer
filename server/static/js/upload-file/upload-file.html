<div class="file" :class="proxy">
    <i class="icon fa-solid" :class="'fa-' + icon"></i>
    <span class="name">{{name}}</span>
    <span class="size">{{size}}</span>
    <div v-if="!proxy" class="overlay">
        <Button class="delete-file" @button-clicked="$emit('delete', name)" :flat="true">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
</div>
