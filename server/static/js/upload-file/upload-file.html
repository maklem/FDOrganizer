<div class="file">
    <i class="icon fa-solid" :class="`fa-${filetypeIcon(type)}`"></i>
    <span class="name">{{name}}</span>
    <span class="size">{{formatFilesize(size)}}</span>
    <div class="overlay">
        <Button class="delete-file" @button-clicked="store.removeFile(name)">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
</div>
