<div class="locale-changer" @keydown.esc="closeMenu">
  <button
    ref="toggle"
    type="button"
    class="locale-toggle"
    :class="{active: open}"
    :aria-label="$t('localeSwitch.label')"
    :title="$t('localeSwitch.label')"
    :aria-expanded="open"
    aria-haspopup="menu"
    @click="open = !open"
  >
    <i class="fa-solid fa-language" aria-hidden="true"></i>
  </button>
  <div v-if="open" class="locale-menu" role="menu" :aria-label="$t('localeSwitch.label')">
    <button
      v-for="language in languages"
      :key="language.code"
      type="button"
      class="locale-option"
      :class="{selected: language.code === $i18n.locale}"
      role="menuitemradio"
      :aria-checked="language.code === $i18n.locale"
      @click="selectLanguage(language.code)"
    >
      {{ language.name }}
    </button>
  </div>
</div>
