<div class="package-content-folder" @click="store.openFolder(id)">
    <a href="#" class="icon">
        <i class="fa-solid fa-folder hover-show"></i>
        <i class="fa-regular fa-folder hover-hidden"></i>
    </a>
    <div class="name">{{name}}</div>
     <div class="count">{{ $t(count === 1 ? 'packageContentFolder.contentOne' : 'packageContentFolder.contentMany', { count }) }}</div>
    <div v-if=editable class="action">
        <Button class="delete" :flat @button-clicked="$refs.folderDelete.showModal()">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
    <div v-if=!editable class="action">
        <Button :flat class="metadata-edit" @button-clicked="$emit('metadata', {type: 'folder', id})">
            <i class="fa-solid fa-book-medical"></i>
        </Button>
    </div>
</div>
<dialog ref="folderDelete" class="delete-folder">
    <h1>{{ $t('packageContentFolder.deleteTitle', { name }) }}</h1>

    <div class="text">{{ $t('packageContentFolder.deleteText') }}</div>
    <div class="text">{{ $t('packageContentFolder.deleteQuestion') }}</div>
    <form method="dialog">
        <Button class="abort-delete" @button-clicked="$refs.folderDelete.close()">{{ $t('packageContentFolder.cancel') }}</Button>
        <Button class="confirm-delete" @button-clicked="deleteFolder(id)">
            <i class="fa-solid fa-trash"></i>
            <div>{{ $t('packageContentFolder.confirm') }}</div>
        </Button>
    </form>
</dialog>
