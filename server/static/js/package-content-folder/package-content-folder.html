<div class="package-content-folder" @click="store.openFolder(id)" :class="{editable}">
    <i class="fa-solid fa-folder icon"></i>
    <div class="name">{{name}}</div>
    <div class="size">{{formattedSize}}</div>
    <div class="count">{{count}} {{count === 1 ? "content" : "contents"}}</div>
    <div v-if=editable class="action">
        <button class="delete" @click="openDialog">
            <i class="fa-solid fa-trash"></i>
        </button>
    </div>
</div>
<dialog ref="folderDelete" class="delete-folder">
    <h1>Delete {{name}}?</h1>

    <div class="text">The folder, its metadata and all contained files and metadata will be deleted.</div>
    <div class="text">With contained external files only the reference and metadata will be lost.</div>
    <div class="text">Do you really want to delete the folder?</div>
    <form method="dialog">
        <Button class="abort-delete" @button-clicked="closeDialog">Do not delete</Button>
        <Button class="confirm-delete" @button-clicked="store.deleteFolder(id)">
            <i class="fa-solid fa-trash"></i>
            <div>Delete folder</div>
        </Button>
    </form>
</dialog>
