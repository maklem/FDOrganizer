<dialog class="metadata-modal" ref="modal">
    <div class="content">
        <header class="metadata-header">
            <i class="fa-solid fa-file-lines"></i>
            <h1 v-if="!!store.document">{{store.document.name}}</h1>
            <button class="back-button" @click="$emit('close')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>
        <details :open="open === 'required'" class="metadata-section">
            <summary class="section-header">
                <i class="icon fa-solid" class= "fa-plus" :class="{'fa-plus': open === 'required'}"></i>
                <h2>Required</h2>
            </summary>
            <fieldset class="field-group">
                
            </fieldset>
        </details>
    </div>
</dialog>
