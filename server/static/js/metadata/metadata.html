<dialog class="metadata-modal" ref="modal">
    <div class="content" v-if="!store.loading.document">
        <header class="metadata-header">
            <i class="fa-solid fa-file-lines"></i>
            <h1 v-if="!!store.document">{{store.document.name}}</h1>
                <LabeledInput
                    :id="'resourceType'"
                    :options="store.resourceType.options"
                    :value="store.resourceType.value"
                    @input="(value) => store.setResourceType(value)"
                    @input="store.touched = true"
                ></LabeledInput>
            <button class="back-button" @click="$emit('close')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>
        <main v-if="!!store.resourceType.value" class="metadata-sections">
            <MetadataSection v-for="key in Object.keys(store.schema)" :id="key" :label="store.sectionLabel(key)" :selectedSection="selectedSection" @select-section=selectSection(key)></MetadataSection>
        </main>
        <div v-else class="choose-type">Choose a Resource Type for the File</div>
        <div class="button-row">
            <Button class="close-button" @button-clicked="$emit('close')">Abort</Button>
            <Button class="save-metadata" @button-clicked="save" :disabled="!store.touched">Save</Button>
        </div>
        <!-- <div class="help-overlay">
            <button @click="helpOverlay=!helpOverlay">x</button>
            <div v-if="helpOverlay">{{JSON.stringify(store.metadata,(key, value) => value ?? "undefined", 4)}}</div>
        </div> -->
    </div>
    <Toast></Toast>
</dialog>
