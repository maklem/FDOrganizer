<div class="package-header">
    <Button class="back-button" :flat @button-clicked="$emit('back')">
        <i class="fa-solid fa-arrow-left"></i>
    </Button>
    <div class="package-name">
        {{store.package.name}}
        <template
            v-for="path in store.pathNames()"
        >
            <div class="icons">
                <i class="fa-solid fa-chevron-right"></i>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="folder-name">{{path}}</div>
        </template>
    </div>
    <slot></slot>
</div>
