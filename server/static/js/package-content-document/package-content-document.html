<div class="package-content-document" :class="{editable}">
    <i class="fa-solid icon" :class="'fa-' + filetypeIcon(type)"></i>
    <div class="name">{{name}}</div>
    <div class="size">{{formatFilesize(size)}}</div>
    <div v-if=editable class="action">
        <Button class="delete" :flat @button-clicked="openDialog">
            <i class="fa-solid fa-trash"></i>
        </Button>
    </div>
    <div v-if=!editable class="action">
        <Button :flat class="metadata-edit" @button-clicked="$emit('metadata', {type: 'document', id})">
            <i class="fa-solid fa-book-medical"></i>
        </Button>
    </div>
</div>
<dialog ref="documentDelete" class="delete-document">
    <h1>{{ $t('packageContentDocument.deleteTitle', { name }) }}</h1>

    <div class="text">{{ $t('packageContentDocument.deleteText1') }}</div>
    <div class="text">{{ $t('packageContentDocument.deleteText2') }}</div>
    <div class="text">{{ $t('packageContentDocument.deleteQuestion') }}</div>
    <form method="dialog">
        <Button class="abort-delete" @button-clicked="$refs.documentDelete.close()">{{ $t('packageContentDocument.cancel') }}</Button>
        <Button class="confirm-delete" @button-clicked="deleteDocument(id)">
            <i class="fa-solid fa-trash"></i>
            <div>{{ $t('packageContentDocument.confirm') }}</div>
        </Button>
    </form>
</dialog>
