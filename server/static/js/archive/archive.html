<App>
    <main class="archive-page">
        <aside class="left-sidebar">
            <template v-if="!store.loading.packageList">
                <template v-for="status in STATUS">
                    <header class="package-status-header">
                        <i class="icon fa-solid" :class="status.icon"></i>
                        <h2 class="text">{{status.name}}</h2>
                    </header>
                    <ArchiveListItem v-if="!!store.packagesWithStatus(status.id).length"
                        v-for="pkg in store.packagesWithStatus(status.id)"
                        v-bind="pkg"
                        @open-metadata="metadataStore.openMetadata('package', pkg.id, store.metadataReadonly(pkg))"
                        @open-settings="settingsStore.openSettings(pkg, 'access', store.settingsReadonly(pkg), true)"
                    ></ArchiveListItem>
                    <div v-else class="no-data-placeholder">No packages with status "{{status.name}}"</div>
                </template>
            </template>
            <div class="loading" v-else></div>
        </aside>
        <PackageContent
            v-if="!!store.selectedPackage"
            @back="store.climbPackagePath()"
            @metadata="metadataStore.openMetadata($event.type, $event.id, store.metadataReadonly(store.selectedPackage))">
            <Button
            v-if="store.selectedPackage.status === 'active'"
            class="side-button"
            @button-clicked="store.requestReview()">
                <i class="fa-solid fa-file-import"></i>
                <div>Submit package</div>
            </Button>
        </PackageContent>
        <Metadata></Metadata>
        <ArchivePackageSettings></ArchivePackageSettings>
    </main>
</App>
