<App>
    <main class="archive-page">
        <aside class="left-sidebar">
            <template v-if="!store.loading.packageList">
                <template v-for="status in STATUS">
                    <header class="package-status-header">
                        <i class="icon fa-solid" :class="status.icon"></i>
                        <h2 class="text">{{ $t('status.archive.' + status.id) }}</h2>
                        <VideoDialog v-if="status.id === 'active'" :title="$t('archive.video.archive.title')" video="HowToArchive_Active">
                            <span class="tutorial-trigger">{{ $t('archive.video.archive.trigger') }}</span>
                        </VideoDialog>
                        <VideoDialog v-if="status.id === 'rework'" :title="$t('archive.video.revise.title')" video="HowToArchive_Rework">
                            <span class="tutorial-trigger">{{ $t('archive.video.revise.trigger') }}</span>
                        </VideoDialog>
                    </header>
                    <ArchiveListItem v-if="!!store.packagesWithStatus(status.id).length"
                        v-for="pkg in store.packagesWithStatus(status.id)"
                        v-bind="pkg"
                        @open-metadata="metadataStore.openMetadata('package', pkg.id, store.metadataReadonly(pkg))"
                        @open-settings="settingsStore.openSettings(pkg, 'access', store.settingsReadonly(pkg), true)"
			@download="goToDownload(pkg.id)"
                    ></ArchiveListItem>
                    <div v-else class="no-data-placeholder">{{ $t('archive.noPackages', { status: $t('status.archive.' + status.id) }) }}</div>
                </template>
            </template>
            <div class="loading" v-else></div>
        </aside>
        <PackageContent
            v-if="!!store.selectedPackage"
            @back="store.climbPackagePath()"
            @metadata="metadataStore.openMetadata($event.type, $event.id, store.metadataReadonly(store.selectedPackage))">
            <Button
            v-if="['rework'].includes(store.selectedPackage.status)"
            class="side-button edit-button"
            @button-clicked="store.openDetails()">
                <i class="fa-solid fa-pen-to-square"></i>
                <div>{{ $t('archive.editProject') }}</div>
            </Button>
            <Button
            v-if="['active', 'rework'].includes(store.selectedPackage.status)"
            class="side-button"
            @button-clicked="store.requestReview()">
                <i class="fa-solid fa-file-import"></i>
                <div>{{ $t('archive.submitPackage') }}</div>
            </Button>
        </PackageContent>
        <Metadata></Metadata>
        <ArchivePackageSettings @package-modified="store.getPackages()"></ArchivePackageSettings>
        <StatusDialog></StatusDialog>
    </main>
</App>
