<label :for="'select-file-' + id" class="import-document">
    <input type="checkbox" name="select-file" :id="'select-file-' + id" class="select" @input="store.toggleSelectFile(id)"/>
    <i class="fa-solid icon" :class="'fa-' + filetypeIcon(type)"></i>
    <div class="name">{{name}}</div>
    <div class="size">{{formatFilesize(size)}}</div>
</label>
