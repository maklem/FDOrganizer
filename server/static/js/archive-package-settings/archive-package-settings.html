<dialog class="package-settings-modal" ref="modal">
    <div class="content" v-if="!store.loading.packageSettings && !!store.package">
        <header class="package-settings-header">
            <i class="fa-solid fa-file-lines"></i>
            <h1>{{store.package.name}}</h1>
            <nav class="settings-tabs">
                <ArchiveSettingsTab v-for="tab in store.TABS" v-bind="tab" :active="tab.id === store.activeTab" @change-tab="(tabId) => store.activeTab = tabId"></ArchiveSettingsTab>
            </nav>
            <Button :flat class="back-button" @button-clicked="store.closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </Button>
        </header>
        <section class="legal-tab" :class="{hidden: store.activeTab !== 'legal'}">
          <div class="introduction">
              {{ $t('archiveSettings.introduction') }}
          </div>
          <form class="package-settings">
              <fieldset class="settings-group terms-and-conditions">
                <legend>{{ $t('archiveSettings.terms.title') }}</legend>
                <div class="radio-option">
                  <input :disabled="store.settingsReadonly"
                  :ref="box => {if(!!box) box.checked = store.checkTerms}"
                  type="checkbox"
                  id="check-terms"
                  @input="event => store.checkTerms = !store.checkTerms">
                  <label for="check-terms" v-html="$t('archiveSettings.terms.agreement')"></label>
                </div>
                <div class="radio-option">
                  <input :disabled="store.settingsReadonly"
                  :ref="box => {if(!!box) box.checked = store.checkDuration}"
                  type="checkbox"
                  id="check-duration"
                  @input="event => store.checkDuration = !store.checkDuration">
                  <label for="check-duration">
                    <i18n-t keypath="archiveSettings.terms.duration">
                      <template v-slot:duration>
                        <LabeledInput
                          class="duration-input"
                          :type="'quantity'"
                          :value="store.duration"
                          :disabled="(!store.checkDuration ? true : undefined) || store.settingsReadonly"
                          :placeholder="$t('archiveSettings.terms.durationPlaceholder')"
                          @input="value => store.duration = value"
                        ></LabeledInput>
                      </template>
                    </i18n-t>
                  </label>
                  </div>
                <div class="radio-option">
                  <input :disabled="store.settingsReadonly"
                  :ref="box => {if(!!box) box.checked = store.checkDSGVO}"
                  type="checkbox"
                  id="check-dsgvo"
                  @input="event => store.checkDSGVO = !store.checkDSGVO">
                  <!-- TODO: Replace dummy link with path to DSGVO-->
                  <label for="check-dsgvo" v-html="$t('archiveSettings.privacy.statement')"></label>
                </div>
                <div class="dsgvo-options">
                  <div class="radio-option">
                    <input :disabled="store.settingsReadonly"
                    :ref="radio => {if (!!radio) radio.checked = store.personalData === radio.value}"
                    type="radio"
                    id="none-personal-data"
                    name="personal-data"
                    value="none"
                    :disabled="!store.checkDSGVO"
                    @input="event => store.personalData = event.currentTarget.value">
                    <label for="none-personal-data">{{ $t('archiveSettings.privacy.removed') }}</label>
                  </div>
                  <div class="radio-option">
                    <input :disabled="store.settingsReadonly"
                    :ref="radio => {if (!!radio) radio.checked = store.personalData === radio.value}"
                    type="radio"
                    id="anonymous-personal-data"
                    name="personal-data"
                    value="anonymous"
                    :disabled="!store.checkDSGVO"
                    @input="event => store.personalData = event.currentTarget.value">
                    <label for="anonymous-personal-data">{{ $t('archiveSettings.privacy.anonymised') }}</label>
                  </div>
                  <div class="radio-option">
                    <input :disabled="store.settingsReadonly"
                    :ref="radio => {if (!!radio) radio.checked = store.personalData === radio.value}"
                    type="radio"
                    id="consent-personal-data"
                    name="personal-data"
                    value="consent"
                    :disabled="!store.checkDSGVO"
                    @input="event => store.personalData = event.currentTarget.value">
                    <label for="consent-personal-data" v-html="$t('archiveSettings.privacy.consent')"></label>
                  </div>
                </div>
              </fieldset>
          </form>
        </section>
        <section class="review-tab" :class="{hidden: store.activeTab !== 'reviews'}">
          <div v-if="store.loading.reviews" class="introduction">
              {{ $t('archiveSettings.reviews.comingSoon') }}
          </div>
          <template v-if="!store.reviewReadonly">
            <div class="add-comment">
              <LabeledInput
                :type="'long-text'"
                :value="store.currentComment"
                :id="'write-comment'"
                :label="$t('archiveSettings.reviews.newComment')"
                @input="(value) => store.currentComment = value"
              ></LabeledInput>
              <Button
                @button-clicked="store.addComment()"
                :disabled="store.currentComment === ''"
              >
                {{ $t('archiveSettings.reviews.add') }}
              </Button>
            </div>
            <div class="current-review">
              <h2>{{ $t('archiveSettings.reviews.current') }}</h2>
              <ul class="comment-list" v-if="store.currentReview?.comments?.length">
                <li v-for="comment in store.currentReview.comments"
                :class="{external: showAuthor(comment)}">
                  <div class="comment-text">{{comment.content}}</div>
                  <Button class="delete" :flat @button-clicked="store.deleteComment(comment.index)">
                      <i class="fa-solid fa-trash"></i>
                  </Button>
                  <div class="author" v-if="showAuthor(comment)">{{comment.owner}}</div>
                </li>
              </ul>
              <div v-else class="no-review">{{ $t('archiveSettings.reviews.noComments') }}</div>
            </div>
          </template>
          <template v-else>
            <div
              v-if="!store.reviews.length"
              class="no-review">
              {{ $t('archiveSettings.reviews.none') }}
            </div>
          </template>
          <div v-for="review in store.reviews"
          class="past-review">
            <h2>{{ $t('archiveSettings.reviews.past', { date: formatRelativeDate(review.creation_date * 1000) }) }}</h2>
            <ul class="comment-list">
              <li v-for="comment in review.comments"
              :class="{external: showAuthor(comment)}">
                <div class="comment-text">{{comment.content}}</div>
                <div class="author" v-if="showAuthor(comment)">{{comment.owner}}</div>
              </li>
            </ul>
          </div>
        </section>
        <div v-if="pageContext === 'archive'" class="button-row">
            <Button class="close-button" @button-clicked="store.closeSettings()">{{ $t('archiveSettings.abort') }}</Button>
            <Button class="save-metadata" :disabled="!store.readyToSaveSettings()" @button-clicked="save">{{ $t('archiveSettings.save') }}</Button>
        </div>
        <div v-else class="button-row">
            <Button v-if="store.activeTab === 'reviews'"
            :disabled="!store.currentReview?.comments?.length"
            class="reject-button"
            @button-clicked="requestChanges()">
                <i class="fa-solid fa-xmark"></i>
                <div>{{ $t('archiveSettings.requestChanges') }}</div>
            </Button>
            <Button class="close-button" @button-clicked="store.closeSettings()">{{ $t('archiveSettings.close') }}</Button>
        </div>
    </div>
</dialog>
