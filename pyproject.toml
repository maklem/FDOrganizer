[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fdorganizer"
version = "0.0.0"
description = "FDOrganizer web application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "beautifulsoup4==4.12.3",
    "couchdb==1.2",
    "dataclasses-json==0.6.6",
    "Flask==3.1.3",
    "Flask-Session==0.8.0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.1",
    "requests_oauth2client==1.5.3",
    "simple-term-menu==1.6.4",
    "windows-curses; sys_platform == 'win32'",
    "xmlschema==3.3.1",
    "zipstream-ng==1.9.0",
]

[project.optional-dependencies]
production = [
    "uWSGI==2.0.31; sys_platform != 'win32'",
]
dev = [
    "docker==7.2.0",
    "pipdeptree==2.20.0",
    "playwright==1.61.0",
    "pre-commit==4.2.0",
    "pytest==9.1.1",
    "pytest-playwright==0.8.0",
    "ruff==0.17.3",
    "testcontainers==4.14.2",
    "ty==0.0.95",
]

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["server.tests*"]
namespaces = true

[tool.setuptools.package-data]
server = [
    "templates/**/*",
    "static/schema.json",
    "static/css/**/*",
    "static/fontawesome/**/*",
    "static/images/**/*",
    "static/js/**/*",
    "static/locale/**/*",
    "metadata_templates/**/*",
]

[tool.bandit]
targets = [ "server" ]
exclude_dirs = [
    ".*",
    "tests",
    "server/tests"
    ]
