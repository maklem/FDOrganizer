version: '3.3'

services:
  fdorganizer:
    build: .
    container_name: fdorganizer
    expose:
      - "8080"
    depends_on:
      - db
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_HOST=db
      - COUCHDB_PORT=5984
    command:
      - sh
      - -c
      - /server/init_db.sh && /server/start.sh
    restart: always

  db:
    image: couchdb:latest
    container_name: db
    expose:
      - "5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    restart: always

  nginx:
    build: ./nginx
    container_name: nginx
    depends_on:
      - fdorganizer
    ports:
      - "34000:80"
    restart: always

  cron:
    build: ./cron_clean
    container_name: cron
    depends_on:
      - db
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_HOST=db
      - COUCHDB_PORT=5984
    restart: always
